{% extends "base.html" %}
{% block title %}{{ indagine.titolo }} — Bacheca Indizi{% endblock %}
{% block extra_head %}
{{ super() }}
<script>document.documentElement.classList.add("indagini-player-page");</script>
<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
{% endblock %}
{% block content %}

<div class="player-wrapper">
    <!-- HEADER MINIMALE -->
    <div class="player-header">
        <h1 class="player-header__title">{{ indagine.titolo }}</h1>
        <span class="player-header__badge">bacheca indizi</span>
        <div class="player-header__pulse" title="Aggiornamento live attivo"></div>
    </div>

    <!-- GRAFO + PANNELLO DETTAGLIO -->
    <div class="player-body">
        <div class="player-graph">
            <div class="graph-scene-bg" id="graphSceneBg"></div>
            <div class="graph-scene-overlay" id="graphSceneOverlay"></div>
            <svg id="playerSvg">
                <defs>
                    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                        <polygon points="0 0, 8 3, 0 6" fill="#2A241C"/>
                    </marker>
                    <marker id="arrowhead-ghost" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
                        <polygon points="0 0, 7 2.5, 0 5" fill="#5A1F1F" opacity="0.5"/>
                    </marker>
                </defs>
                <g id="playerG"></g>
            </svg>
        </div>
        <div class="player-detail" id="playerDetail">
            <button class="player-detail__close" id="playerDetailClose" title="Chiudi (×)">×</button>
            <div class="player-detail__inner" id="playerDetailInner"></div>
        </div>
    </div>
</div>

<div class="sipario-black-overlay" id="siparioOverlay">
    <div class="sipario-black-overlay__mark">
        <span>Interludio</span>
        <strong>Sipario chiuso</strong>
        <span>La scena deve iniziare</span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
<script id="indagini-player-data" type="application/json">{{
    graph_data
    |
    safe
}}</script>
<script>
    window.INDAGINI_PLAYER_CONFIG = {
        indagineId: {{ indagine.id }},
        pollMs: 2000,
        defaultBackgroundUrl: "{{ url_for('sfondo_default') }}",
        endpoints: {
            statoPlayer: "{{ url_for('indagini.indagini_stato_player', indagine_id=indagine.id) }}"
        },
        sfx: {
            rivelazione: "{{ url_for('static', filename='audio/sfx/rivelazione.mp3') }}",
            livelloBase: "{{ url_for('static', filename='audio/sfx/livello__LIVELLO__.mp3') }}"
        }
    };
</script>
<script src="{{ url_for('static', filename='indagini-shared.js') }}"></script>
<script src="{{ url_for('static', filename='indagini-player.js') }}"></script>

{% endblock %}
